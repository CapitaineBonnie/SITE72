<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SITE-72 — Ajout SCP-7608</title>
<style>
body{font-family:monospace;background:#040d17;color:#cfe3ef;padding:30px;max-width:700px;margin:0 auto;}
h1{color:#5fd4ff;margin-bottom:10px;}
p{color:#7fa1b8;margin-bottom:20px;line-height:1.6;}
.log{background:#0a1c2e;border:1px solid #1c3b52;border-radius:4px;padding:16px;min-height:100px;white-space:pre-wrap;font-size:12px;line-height:1.6;margin:20px 0;max-height:400px;overflow-y:auto;}
.ok{color:#8ff0d3;}.err{color:#ff9d9d;}.info{color:#ffc98a;}
button{font-family:monospace;background:transparent;border:1px solid #2fa8d1;color:#5fd4ff;padding:14px 24px;border-radius:6px;cursor:pointer;font-size:14px;width:100%;}
button:active{background:rgba(47,168,209,.2);}
button:disabled{opacity:.4;cursor:not-allowed;}
</style>
</head>
<body>
<h1>SITE-72 — Ajout SCP-7608</h1>
<p>Ajoute SCP-7608 dans la base Firebase sans toucher aux autres SCP.</p>
<button id="btn">Ajouter SCP-7608</button>
<div class="log" id="log">En attente...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyBaoDKrtIJO8dLSnKw0puoLS5QjM1uZx_g",
  authDomain:"site72-77f10.firebaseapp.com",
  projectId:"site72-77f10",
  storageBucket:"site72-77f10.firebasestorage.app",
  messagingSenderId:"709748220198",
  appId:"1:709748220198:web:06c3266d0790451f8361e7"
});
const db = getFirestore(app);
const log = document.getElementById("log");
const btn = document.getElementById("btn");
function p(msg,cls){log.innerHTML+="<span class='"+(cls||"")+"'>"+msg+"</span>\n";log.scrollTop=log.scrollHeight;}

const SCP_7608 = {
  name: "SCP-7608",
  id: "SCP-7608",
  classe: "keter",
  img: "",
  desc: `SCP-7608 est une anomalie mémétique dont la véritable apparence demeure inconnue. Chaque observateur perçoit une manifestation différente correspondant à ses traumatismes, regrets, croyances, peurs ou souvenirs les plus enfouis. Certaines personnes observent un proche disparu. D'autres déclarent voir une créature religieuse, une silhouette sans visage, un simple couteau, un animal, une porte, ou encore une version altérée d'elles-mêmes.

Aucun enregistrement vidéo n'a jamais reproduit fidèlement ce que les témoins affirment avoir vu.

Les individus présentant peu ou pas de culpabilité perçoivent presque systématiquement une même entité désignée SCP-7608-1 — un individu dont l'âge, le sexe et les caractéristiques physiques changent constamment, dont le visage demeure flou sur tous les témoignages. Après plusieurs minutes de silence, SCP-7608-1 prononce toujours la même phrase : « Tu étais déjà ici avant de naître... pourquoi fais-tu semblant de ne pas t'en souvenir ? »

SCP-7608-2 est une entité associée : une silhouette humanoïde mesurant environ 2,30 mètres, vêtue d'une longue robe noire à capuche. Aucun visage n'a jamais été observé sous la capuche. Les rares paroles enregistrées sont : « Tu regardes encore. » ou « Trop tard. »

AVERTISSEMENT MEMETIQUE : Si, après la lecture de ce dossier, vous avez l'impression d'avoir oublié le visage d'une personne importante, ou si vous croyez reconnaître SCP-7608-1 sans pouvoir expliquer pourquoi, contactez immédiatement un Agent Mémétique de garde.`,
  meta: `Classe : Keter — Niveau de menace : NOIR — Confinement : Chambre sphérique, 4m plomb + béton baryté + mousse acoustique — Accréditation requise : Niveau 4/7608 — Observation max. : 15 minutes — Deux Agents Mémétiques obligatoires en permanence`,
  order: 9999
};

btn.addEventListener("click", async function(){
  btn.disabled = true;
  log.innerHTML = "";
  p("Vérification des SCP existants...", "info");

  const snap = await getDocs(collection(db,"scp"));
  const existing = snap.docs.map(d => d.data().name);

  if(existing.includes("SCP-7608")){
    p("SCP-7608 est déjà présent dans la base.", "info");
    p("Aucune action effectuée.", "info");
    return;
  }

  try{
    await addDoc(collection(db,"scp"), SCP_7608);
    p("SCP-7608 ajoute avec succes !", "ok");
    p("Retournez sur le portail pour le voir apparaitre.", "info");
  } catch(e){
    p("Erreur : " + e.message, "err");
  }
});
</script>
</body>
</html>
